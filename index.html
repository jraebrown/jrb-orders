<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jonathan's Discount Order Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    background: #f4f4f4;
}

h1 {
    text-align:center;
}

.search {
    width:100%;
    padding:12px;
    margin-bottom:20px;
    font-size:16px;
}

.product-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.product {
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.price {
    font-weight:bold;
    color:green;
}

.qty-controls {
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.qty-controls button {
    width:35px;
    height:35px;
    cursor:pointer;
}

.summary {
    background:white;
    margin-top:30px;
    padding:20px;
    border-radius:10px;
}

input, textarea {
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

.action-buttons {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.action-buttons button {
    flex:1;
    min-width:200px;
    padding:15px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
}

.whatsapp {
    background:#25D366;
}

.email {
    background:#0078D4;
}
</style>
</head>

<body>

<h1>Jonathan's Discount Order Form</h1>

<p>
Prices may change and stock is not guaranteed.
Orders are requests only until confirmed.
</p>

class="search"
id="search"
placeholder="Search products..."
onkeyup="filterProducts()">

<div class="product-grid" id="products"></div>

<div class="summary">

<h2>Your Details</h2>

<input id="customerName" placeholder="Your Name">

<input id="customerPhone" placeholder="Phone Number">

<textarea
id="notes"
rows="4"
placeholder="Notes, colours, sizes etc."></textarea>

<h2>Total: £<span id="total">0.00</span></h2>

<div class="action-buttons">
<button class="whatsapp" onclick="sendWhatsApp()">
Send via WhatsApp
</button>

<button class="email" onclick="sendEmail()">
Send via Email
</button>
</div>

</div>

const quantities = {};

function renderProducts() {

const container = document.getElementById("products");


container.innerHTML = "";

products.forEach((p,index)=>{

quantities[index] = quantities[index] || 0;

container.innerHTML += `
<div class="product">

<h3>${p.name}</h3>

<div class="price">
£${p.price.toFixed(2)}
</div>

<div class="qty-controls">
<button onclick="changeQty(${index},-1)">−</button>

<span id="qty-${index}">
${quantities[index]}
</span>

<button onclick="changeQty(${index},1)">+</button>
</div>

</div>`;
});

}

function changeQty(id,amount){

quantities[id] =
Math.max(0,(quantities[id]||0)+amount);

document.getElementById(`qty-${id}`).textContent =
quantities[id];

updateTotal();

}

function updateTotal(){

let total = 0;

products.forEach((p,index)=>{

total += p.price * (quantities[index] || 0);

});

document.getElementById("total").textContent =
total.toFixed(2);

}

function buildOrderText(){

const name =
document.getElementById("customerName").value;

const phone =
document.getElementById("customerPhone").value;

const notes =
document.getElementById("notes").value;

let text =
`NEW ORDER\n\n`;

text += `Name: ${name}\n`;
text += `Phone: ${phone}\n\n`;

let total = 0;

products.forEach((p,index)=>{

if((quantities[index]||0)>0){

const lineTotal =
p.price * quantities[index];

total += lineTotal;

text +=
`${p.name} x${quantities[index]} (£${lineTotal.toFixed(2)})\n`;

}

});

text += `\nTotal: £${total.toFixed(2)}\n`;

if(notes){
text += `\nNotes:\n${notes}`;
}

return text;
}

function sendWhatsApp(){

const text =
encodeURIComponent(buildOrderText());

window.open(
`https://wa.me/${YOUR_WHATSAPP}?text=${text}`,
"_blank"
);

}

function sendEmail(){

const subject =
encodeURIComponent("New Discount Order");

const body =
encodeURIComponent(buildOrderText());

window.location.href =
`mailto:${YOUR_EMAIL}?subject=${subject}&body=${body}`;

}

function filterProducts(){

const term =
document.getElementById("search")
.value
.toLowerCase();

document.querySelectorAll(".product")
.forEach(card=>{

card.style.display =
card.textContent
.toLowerCase()
.includes(term)
? "block"
: "none";

});

}

renderProducts();
updateTotal();
