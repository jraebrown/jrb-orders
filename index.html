<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JRB Aroma Products - Order Form</title>
<style>
  /* Base styles integrated from price_list (2).html[cite: 5] */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Arial', sans-serif;
    background: #1a1a2e;
    color: #fff;
    padding-bottom: 80px; /* Space for the sticky checkout bar */
  }

  .container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 20px;
  }

  .page-header h1 {
    font-size: 24pt;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #e53935, #ff6f00, #ffd600, #ff6f00, #e53935);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 8px rgba(229,57,53,0.5));
  }

  .promo-badge {
    display: inline-block;
    background: linear-gradient(135deg, #e53935, #b71c1c);
    color: #fff;
    font-size: 11pt;
    font-weight: 800;
    padding: 5px 20px;
    border-radius: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 10px;
    box-shadow: 0 2px 10px rgba(229,57,53,0.5);
  }

  /* Form Section adapted from index.html[cite: 4] */
  .form-section {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 30px;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .form-section h2 {
    margin-bottom: 15px;
    color: #ffd600;
  }

  .form-section input, .form-section textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3);
    color: white;
    font-size: 16px;
  }

  /* Grid Layout[cite: 5] */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
  }

  .card {
    background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    backdrop-filter: blur(4px);
    transition: transform 0.2s;
  }

  .card.has-qty {
    border: 1px solid #4caf50;
    box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #e53935, #ff6f00, #ffd600);
    opacity: 0.7;
  }

  .img-wrap {
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;
  }

  .card-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 4px;
  }

  .product-name {
    font-size: 10pt;
    font-weight: 700;
    line-height: 1.3;
    text-transform: uppercase;
    min-height: 2.6em;
  }

  .product-size {
    font-size: 8pt;
    color: rgba(255,193,7,0.85);
    font-weight: 600;
  }

  .price-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }

  .price-original {
    font-size: 8pt;
    color: rgba(255,255,255,0.4);
    text-decoration: line-through;
    text-decoration-color: #e53935;
  }

  .price-sale {
    font-size: 12pt;
    font-weight: 900;
    color: #ffd600;
  }

  .discount-tag {
    background: linear-gradient(135deg, #e53935, #b71c1c);
    color: #fff;
    font-size: 7pt;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: auto;
  }

  .stock-row {
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-between;
  }

  .stock-item {
    font-size: 7pt;
    color: rgba(255,255,255,0.55);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .stock-dot { width: 6px; height: 6px; border-radius: 50%; }
  .stock-dot.in { background: #4caf50; }
  .stock-dot.other { background: #2196f3; }

  /* Quantity Controls mapped for order_script.js[cite: 6] */
  .qty-control {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    padding: 4px;
  }

  .qty-btn {
    background: rgba(255,255,255,0.1);
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  
  .qty-btn:hover { background: rgba(255,255,255,0.2); }

  .qty-input {
    width: 40px;
    text-align: center;
    background: transparent;
    color: white;
    border: none;
    font-weight: bold;
    font-size: 14px;
  }

  .line-total {
    font-size: 9pt;
    color: #4caf50;
    text-align: right;
    margin-top: 5px;
    min-height: 15px;
    font-weight: bold;
  }

  /* Checkout Footer */
  .checkout-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0f3460;
    padding: 15px 20px;
    border-top: 2px solid #e53935;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
  }

  .totals-info {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .totals-info div {
    display: flex;
    flex-direction: column;
  }

  .totals-label { font-size: 9pt; color: rgba(255,255,255,0.6); }
  .totals-value { font-size: 14pt; font-weight: bold; color: #ffd600; }
  .totals-saved { color: #4caf50; font-size: 10pt; }

  .btn-review {
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 6px;
    font-size: 12pt;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
  }

  /* Modal Styles matched to order_script.js ids[cite: 6] */
  #modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
  }

  #modal.active { display: flex; }

  .modal-content {
    background: #16213e;
    padding: 25px;
    border-radius: 10px;
    width: 95%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  }

  .modal-content h2 { margin-bottom: 20px; color: #ffd600; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
  
  .modal-section { margin-bottom: 20px; }
  .modal-section h3 { font-size: 12pt; color: rgba(255,255,255,0.6); margin-bottom: 10px; }
  
  #modal-customer { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 6px; font-size: 10pt; line-height: 1.5; }
  
  .order-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    border-bottom: 1px dashed rgba(255,255,255,0.1);
    padding-bottom: 8px;
  }

  .order-summary-totals {
    background: rgba(0,0,0,0.3);
    padding: 15px;
    border-radius: 6px;
    margin-top: 15px;
  }

  .summary-line { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .summary-line.grand-total { font-size: 14pt; font-weight: bold; color: #ffd600; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.2); }
  .summary-line.savings { color: #4caf50; }

  .modal-actions {
    display: flex;
    gap: 15px;
    margin-top: 25px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1; min-width: 200px;
    padding: 12px; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: none; font-size: 12pt;

  .btn-whatsapp { background: #25D366; color: white; }
  .btn-email { background: #0078D4; color: white; }
  .btn-close { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; margin-top: 10px; }

  @media (max-width: 600px) {
    .checkout-bar { flex-direction: column; gap: 15px; }
    .btn-review { width: 100%; }
  }
</style>

  <button class="btn-review" onclick="openModal()">Review Order</button>
</div>

<!-- Review Modal -->
<div id="modal">

        <div class="summary-line grand-total">

          <span id="modal-total">£0.00</span>
        </div>
      </div>
    </div>

    <div class="modal-actions" id="modal-actions">
      <!-- Buttons populated by JS -->
    </div>
    <button class="btn btn-close" onclick="closeModal()">Back to Form</button>
  </div>
</div>

const qty = {};

function fmt(n){ return '£'+n.toFixed(2); }

function buildGrid(gridId, from, to){
  const grid = document.getElementById(gridId);
  products.slice(from-1, to).forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-'+p.id;
    card.innerHTML = `
      <div class="img-wrap"><img src="${p.img}" alt="${p.name}" onerror="this.style.opacity='0.2'"></div>
      <div class="card-body">
        <div class="product-name">${p.name}</div>
        <div class="product-size">${p.size}</div>
        <div class="price-row">
          <span class="price-original">${fmt(p.orig)}</span>
          <span class="price-sale">${fmt(p.price)}</span>
          <span class="discount-tag">-30%</span>
        </div>
        <div class="stock-row">
          <div class="stock-item"><span class="stock-dot in"></span>In Store: <span class="stock-num">${p.inStore}</span></div>
          <div class="stock-item"><span class="stock-dot other"></span>Other: <span class="stock-num">${p.other}</span></div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
          <input class="qty-input" type="number" min="0" value="0" id="qty-${p.id}" onchange="setQty(${p.id},this.value)">
          <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
        </div>
        <div class="line-total" id="lt-${p.id}"></div>
      </div>`;
    grid.appendChild(card);
  });
}

function changeQty(id, delta){
  const input = document.getElementById('qty-'+id);
  const newVal = Math.max(0, (parseInt(input.value)||0) + delta);
  input.value = newVal;
  setQty(id, newVal);
}

function setQty(id, val){
  const n = Math.max(0, parseInt(val)||0);
  document.getElementById('qty-'+id).value = n;
  qty[id] = n;
  const p = products.find(x=>x.id===id);
  const lt = document.getElementById('lt-'+id);
  const card = document.getElementById('card-'+id);
  if(n > 0){
    lt.textContent = `${n} × ${fmt(p.price)} = ${fmt(n*p.price)}`;
    card.classList.add('has-qty');
  } else {
    lt.textContent = '';
    card.classList.remove('has-qty');
    delete qty[id];
  }
  updateTotals();
}

function updateTotals(){
  let items=0, cost=0, saved=0;
  products.forEach(p => {
    const q = qty[p.id]||0;
    if(q>0){ items+=q; cost+=q*p.price; saved+=q*(p.orig-p.price); }
  });
  document.getElementById('total-items').textContent = items;
  document.getElementById('total-cost').textContent = fmt(cost);
  document.getElementById('total-saved').textContent = fmt(saved);
}

function getOrderedItems(){
  return products.filter(p => (qty[p.id]||0) > 0);
}

function buildOrderText(){
  const name = document.getElementById('cname').value.trim();
  const biz  = document.getElementById('cbusiness').value.trim();
  const phone= document.getElementById('cphone').value.trim();
  const email= document.getElementById('cemail').value.trim();
  const notes= document.getElementById('cnotes').value.trim();
  const items = getOrderedItems();
  if(!items.length) return null;

  let cost=0, orig=0;
  let lines = items.map(p => {
    const q = qty[p.id];
    const line = q * p.price;
    const lineOrig = q * p.orig;
    cost += line; orig += lineOrig;
    return `• ${p.name} (${p.size}) × ${q} = ${fmt(line)}`;
  });

  const saved = orig - cost;
  let text = `🛒 JRB AROMA PRODUCTS ORDER\n`;
  text += `━━━━━━━━━━━━━━━━━━━━━━\n`;
  if(name)  text += `👤 Name: ${name}\n`;
  if(biz)   text += `🏪 Business: ${biz}\n`;
  if(phone) text += `📞 Phone: ${phone}\n`;
  if(email) text += `📧 Email: ${email}\n`;
  text += `━━━━━━━━━━━━━━━━━━━━━━\n`;
  text += lines.join('\n') + '\n';
  text += `━━━━━━━━━━━━━━━━━━━━━━\n`;
  text += `Original Total: ${fmt(orig)}\n`;
  text += `💚 You Save: ${fmt(saved)}\n`;
  text += `✅ ORDER TOTAL: ${fmt(cost)}\n`;
  if(notes) text += `📝 Notes: ${notes}\n`;
  text += `━━━━━━━━━━━━━━━━━━━━━━\n`;
  text += `Sent via JRB Order Form`;
  return {text, cost, orig, saved};
}

function openModal(){
  const items = getOrderedItems();
  if(!items.length){ alert('Please add at least one item to your order.'); return; }

  const name = document.getElementById('cname').value.trim();
  const biz  = document.getElementById('cbusiness').value.trim();
  const phone= document.getElementById('cphone').value.trim();
  const email= document.getElementById('cemail').value.trim();
  const notes= document.getElementById('cnotes').value.trim();

  // Customer info
  let custHtml = '';
  if(name)  custHtml += `<strong>Name:</strong> ${name}<br>`;
  if(biz)   custHtml += `<strong>Business:</strong> ${biz}<br>`;
  if(phone) custHtml += `<strong>Phone:</strong> ${phone}<br>`;
  if(email) custHtml += `<strong>Email:</strong> ${email}<br>`;
  if(notes) custHtml += `<strong>Notes:</strong> ${notes}<br>`;
  document.getElementById('modal-customer').innerHTML = custHtml || '<em style="color:rgba(255,255,255,0.35)">No contact details entered</em>';

  // Items
  let cost=0, orig=0;
  let itemsHtml = '';
  items.forEach(p => {
    const q = qty[p.id];
    const line = q * p.price;
    const lineOrig = q * p.orig;
    cost += line; orig += lineOrig;
    itemsHtml += `<div class="order-item">
      <span class="order-item-name">${p.name} <span style="color:rgba(255,255,255,0.4);font-size:10px">(${p.size})</span></span>
      <span class="order-item-qty">×${q}</span>
      <span class="order-item-price">${fmt(line)}</span>
    </div>`;
  });
  document.getElementById('modal-items').innerHTML = itemsHtml;

  const saved = orig - cost;
  document.getElementById('modal-orig').textContent = fmt(orig);
  document.getElementById('modal-saved').textContent = fmt(saved);
  document.getElementById('modal-total').textContent = fmt(cost);

  // Action buttons
  const order = buildOrderText();
  const waText = encodeURIComponent(order.text);
  const waUrl = `https://wa.me/${YOUR_WHATSAPP}?text=${waText}`;

  const subject = encodeURIComponent(`JRB Aroma Order${name?' from '+name:''} — ${fmt(cost)}`);
  const body = encodeURIComponent(order.text);
  const mailUrl = `mailto:${YOUR_EMAIL}?subject=${subject}&body=${body}`;

  document.getElementById('modal-actions').innerHTML = `
    <a href="${waUrl}" target="_blank" class="btn btn-whatsapp">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Send via WhatsApp
    </a>
    <a href="${mailUrl}" class="btn btn-email">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
      Send via Email
    </a>`;

  document.getElementById('modal').classList.add('active');
}

function closeModal(){
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});

// Build grids
buildGrid('grid-1', 1, 30);

buildGrid('grid-3', 61, 66);
